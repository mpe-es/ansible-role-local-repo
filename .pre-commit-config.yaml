---
###############################################################################
# Filename: .pre-commit-config.yaml
# Role: ansible-role-local-repo
# Summary: Pre-commit hooks for local linting before push
# Last Updated: 16 Nov 2026
# Classification: UNCLASSIFIED
###############################################################################
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# 4.5.0 introduced `language: unsupported`, used by the ansible-lint hook.
minimum_pre_commit_version: '4.5.0'

repos:
  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # frozen: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        types: [yaml]

  # Ansible Linting
  # Runs the ansible-lint installed from requirements.txt (see CONTRIBUTING.md).
  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: unsupported
        pass_filenames: false
        always_run: true

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
