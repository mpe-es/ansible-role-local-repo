---
###############################################################################
# Filename: tests/rename-guard-case.yml
# Role: ansible-role-local-repo
# Summary: One rename-guard case: run an entry point, expect a given failure
# Last Updated: 16 Nov 2026
# Classification: UNCLASSIFIED
###############################################################################
- name: "Run the case through {{ case_tasks_from }}"
  block:
    - name: "Include local_repo through {{ case_tasks_from }}"
      ansible.builtin.include_role:
        name: local_repo
        tasks_from: "{{ case_tasks_from }}"

    - name: "Fail because the case was accepted by {{ case_tasks_from }}"
      ansible.builtin.fail:
        msg: the entry point did not stop where expected
  rescue:
    - name: "Confirm where the run stopped for {{ case_tasks_from }}"
      ansible.builtin.assert:
        that: >-
          (case_expect is defined and case_expect in ansible_failed_result.msg)
          or (case_expect_task is defined
              and ansible_failed_task.name is search(case_expect_task)
              and (case_expect_url is undefined
                   or (ansible_failed_result.results[0].url == case_expect_url
                       and 'Request failed' in ansible_failed_result.results[0].msg)))
        fail_msg: >-
          stopped at {{ ansible_failed_task.name }}:
          {{ ansible_failed_result.msg | default('') }}
