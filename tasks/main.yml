---
###############################################################################
# Filename: tasks/main.yml
# Role: ansible-role-local-repo
# Summary: Dispatch to the platform-specific repository configuration tasks
# Last Updated: 18 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################
# ansible-lint name[template] requires any Jinja expression to be the LAST
# element of a task name, hence the trailing-variable phrasing below.

# Trust first. The repository mirrors below are reached over HTTPS, so the
# enclave anchors have to be installed before any repository file is written.
- name: Configure Enclave Certificate Authorities
  ansible.builtin.include_tasks: configure-ca.yml
  when:
    - configure_local_cert_authority

- name: "Configure local repositories for {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: redhat.yml
  when: "ansible_facts['distribution'] in ['RedHat']"

- name: "Configure local repositories for {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: oracle.yml
  when: "ansible_facts['distribution'] in ['OracleLinux']"
