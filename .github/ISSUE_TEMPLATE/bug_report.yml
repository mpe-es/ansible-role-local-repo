---
###############################################################################
# Filename: .github/ISSUE_TEMPLATE/bug_report.yml
# Role: ansible-role-local-repo
# Summary: Issue form for reporting a defect in the role's behavior
# Last Updated: 17 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################
name: Bug report
description: Report a defect in the role's behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** report
        security vulnerabilities here. Use private reporting per SECURITY.md.

        Redact internal hostnames, enclave names, and unit identifiers before
        posting. This is a public repository.
  - type: checkboxes
    attributes:
      label: Preconditions
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those go through private reporting)
          required: true
        - label: I have redacted internal hostnames and operational identifiers
          required: true
  - type: input
    id: role-version
    attributes:
      label: Role version
      description: Release tag or git commit hash
      placeholder: v0.1.0 (or commit sha)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - RHEL 8
        - RHEL 9
        - RHEL 10
        - Oracle Linux 9
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: ansible-version
    attributes:
      label: ansible-core version
      placeholder: "2.21.3"
    validations:
      required: true
  - type: textarea
    id: role-variables
    attributes:
      label: Role variables in use
      description: >
        The values you passed for local_repo_server, web_protocol, and the
        repo folder variables. Replace real hostnames with a placeholder.
      render: yaml
      placeholder: |
        local_repo_server: repo.example.invalid
        web_protocol: https
        local_baseos_repo_folder: rhel-10-for-x86_64-baseos-rpms
    validations:
      required: true
  - type: checkboxes
    id: mirror-state
    attributes:
      label: Repository mirror state
      description: >
        The most common cause of a failure here is the mirror itself, not the
        role. Please confirm before filing.
      options:
        - label: The repository server is reachable from the target host
        - label: The repository paths exist and are populated on the server
        - label: The GPG key referenced by gpgkey exists on the target host
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce this?
      placeholder: |
        1. Run the role against ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: >
        Include relevant Ansible output, and the contents of the generated
        file under /etc/yum.repos.d/ if applicable. Redact sensitive values.
      render: shell
    validations:
      required: false
